<div class="t-panel overflow-hidden">
  <div class="t-panel-head">
    <span>آخر الأسعار المسجلة</span>
    <span class="text-xs text-[var(--gold)]">ر.ع / جرام</span>
  </div>
  <div class="overflow-x-auto">
    <table class="w-full text-sm text-right border-collapse">
      <thead>
        <tr class="text-[var(--muted)] border-b border-[var(--line)] text-xs font-bold">
          <th class="py-3 px-5">التاريخ</th>
          <th class="py-3 px-5">عيار 18</th>
          <th class="py-3 px-5">عيار 21</th>
          <th class="py-3 px-5">عيار 22</th>
          <th class="py-3 px-5 text-[var(--gold)]">عيار 24</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-[var(--line)] text-[var(--text)]">
        @for (day of reversedHistory; track day.date) {
          <tr class="transition-colors hover:bg-[var(--gold-soft)]">
            <td class="py-2.5 px-5 t-num text-xs text-[var(--muted)]">{{ formatDate(day.date) }}</td>
            <td class="py-2.5 px-5 t-num">{{ day.price18k.toFixed(3) }}</td>
            <td class="py-2.5 px-5 t-num">{{ day.price21k.toFixed(3) }}</td>
            <td class="py-2.5 px-5 t-num">{{ day.price22k.toFixed(3) }}</td>
            <td class="py-2.5 px-5 t-num font-bold text-[var(--gold)]">{{ day.price24k.toFixed(3) }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
