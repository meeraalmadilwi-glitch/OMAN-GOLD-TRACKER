<div class="gold-glass-card rounded-2xl p-6 sm:p-8 overflow-hidden">
  <div class="overflow-x-auto rounded-xl border border-[#d4af37]/35 shadow-sm">
    <table class="w-full text-sm text-right border-collapse">
      <thead>
        <tr class="bg-[#f5ebd7] dark:bg-[#2a2415] text-[#5e3f08] dark:text-[#e6c76a] border-b border-[#d4af37]/45 text-xs sm:text-sm font-black">
          <th class="py-4 px-5">📅 التاريخ</th>
          <th class="py-4 px-5">عيار 18</th>
          <th class="py-4 px-5">عيار 21</th>
          <th class="py-4 px-5">عيار 22</th>
          <th class="py-4 px-5">عيار 24 (الأنقى)</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-[#d4af37]/15 text-[#382813] dark:text-[#f1f1f1]">
        @for (day of reversedHistory; track day.date) {
          <tr class="transition-colors hover:bg-[#faedd0] dark:hover:bg-[#2a2415] odd:bg-[#ffffff] dark:odd:bg-[#1a1b22] even:bg-[#faf7f0] dark:even:bg-[#14151a]">
            <td class="py-3.5 px-5 font-mono text-xs sm:text-sm text-[#5a4628] dark:text-[#e9dcb8] font-bold">{{ formatDate(day.date) }}</td>
            <td class="py-3.5 px-5 font-mono">{{ day.price18k.toFixed(3) }} <span class="text-[11px] text-gray-500 dark:text-gray-400">ر.ع</span></td>
            <td class="py-3.5 px-5 font-mono">{{ day.price21k.toFixed(3) }} <span class="text-[11px] text-gray-500 dark:text-gray-400">ر.ع</span></td>
            <td class="py-3.5 px-5 font-mono">{{ day.price22k.toFixed(3) }} <span class="text-[11px] text-gray-500 dark:text-gray-400">ر.ع</span></td>
            <td class="py-3.5 px-5 font-mono font-black text-[#8a5c0b] dark:text-[#e6c76a] bg-[#f9f1de] dark:bg-[#2a2415]">
              {{ day.price24k.toFixed(3) }} <span class="text-[11px] text-[#8a5c0b] dark:text-[#e6c76a]">ر.ع</span>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
