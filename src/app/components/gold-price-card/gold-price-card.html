<div class="t-panel p-5 relative overflow-hidden hover:-translate-y-1">
  <!-- Decorative corner pattern -->
  <div class="omani-pattern absolute -top-4 -left-4 w-28 h-28 opacity-60 pointer-events-none"></div>
  <div class="absolute top-0 inset-x-0 h-1 bg-gradient-to-l from-[var(--red)] via-[var(--gold)] to-[var(--green)]"></div>

  <div class="relative flex items-center justify-between">
    <span class="t-display text-lg font-bold text-[var(--gold)]">{{ karatLabel }}</span>
    <span class="text-xs font-bold text-[var(--muted)] bg-[var(--panel-2)] px-2.5 py-1 rounded-full">نقاء {{ purity }}</span>
  </div>

  <div class="relative mt-5 flex items-baseline gap-2 justify-end" dir="ltr">
    <span class="t-num text-4xl font-black text-[var(--text)]">{{ price.toFixed(3) }}</span>
    <span class="text-sm font-bold text-[var(--muted)]">{{ currency }}</span>
  </div>

  <div class="relative mt-4 pt-3 border-t border-dashed border-[var(--line)] flex items-center justify-between text-xs">
    <span class="text-[var(--muted)] font-medium">{{ unit }}</span>
    @if (change !== null) {
      <span
        class="t-num font-bold px-2 py-0.5 rounded-full"
        [class.t-up]="change >= 0"
        [class.t-down]="change < 0"
        [class.bg-[var(--panel-2)]]="true"
      >
        {{ change >= 0 ? '▲ +' : '▼ ' }}{{ change.toFixed(3) }}
      </span>
    }
  </div>
</div>
