<header class="sticky top-0 z-50 bg-[var(--panel)]/95 backdrop-blur-md border-b border-[var(--line)]">
  <div class="omani-stripe"></div>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">

    <!-- Logo & Title -->
    <div class="flex items-center gap-3">
      <img
        src="gold.jpg"
        alt="شعار الذهب العُماني"
        class="w-10 h-10 rounded-full object-cover border-2 border-[var(--gold)]/70"
      />
      <div class="leading-tight">
        <span class="t-display text-xl font-bold text-[var(--text)] block">الذهب العُماني</span>
        <span class="text-[11px] text-[var(--gold)] font-bold">أسعار الذهب في سلطنة عُمان</span>
      </div>
    </div>

    <!-- Navigation links -->
    <nav class="hidden md:flex items-center gap-1 text-sm font-bold text-[var(--muted)]">
      <a href="#today-prices" class="px-4 py-2 rounded-full hover:bg-[var(--gold-soft)] hover:text-[var(--gold)] transition-colors">الأسعار</a>
      <a href="#calculator" class="px-4 py-2 rounded-full hover:bg-[var(--gold-soft)] hover:text-[var(--gold)] transition-colors">الحاسبة</a>
      <a href="#trend" class="px-4 py-2 rounded-full hover:bg-[var(--gold-soft)] hover:text-[var(--gold)] transition-colors">الرسم البياني</a>
      <a href="#history" class="px-4 py-2 rounded-full hover:bg-[var(--gold-soft)] hover:text-[var(--gold)] transition-colors">السجل</a>
    </nav>

    <!-- Right side: status badges and theme toggle -->
    <div class="flex items-center gap-2">
      <span class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-[var(--panel-2)] text-[var(--muted)] border border-[var(--line)]">
        <span class="w-2 h-2 rounded-full bg-[var(--green)] animate-pulse"></span>
        سوق مسقط
      </span>
      <span class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-bold bg-[var(--gold-soft)] text-[var(--gold)] border border-[var(--gold)]/40">
        بيانات تجريبية
      </span>
      <button
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="isDark ? 'التبديل إلى الوضع الفاتح' : 'التبديل إلى الوضع الداكن'"
        [attr.aria-pressed]="isDark"
        class="w-10 h-10 rounded-full flex items-center justify-center text-base border border-[var(--line)] bg-[var(--panel-2)] hover:border-[var(--gold)] transition-colors cursor-pointer"
      >
        {{ isDark ? '☀️' : '🌙' }}
      </button>
    </div>

  </div>

  <!-- Navigation links on small screens -->
  <nav class="md:hidden border-t border-[var(--line)] overflow-x-auto">
    <div class="flex gap-5 px-4 py-2.5 text-xs font-bold text-[var(--muted)] whitespace-nowrap">
      <a href="#today-prices">الأسعار</a>
      <a href="#calculator">الحاسبة</a>
      <a href="#trend">الرسم البياني</a>
      <a href="#history">السجل</a>
    </div>
  </nav>
</header>
